spring.application.name=B-MAD
# LogSentinel V4 Dashboard Configuration
# Security Credentials (MANDATORY: Set via environment variables)
dashboard.admin.user=${DASHBOARD_ADMIN_USER}
dashboard.admin.password=${DASHBOARD_ADMIN_PASSWORD}

# LogSentinel V5 Persistence Configuration
spring.datasource.url=jdbc:h2:file:./data/logsentinel
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# H2 Console is DISABLED by default for security. 
# Re-enable in dev mode using: -Dspring.profiles.active=dev
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# Disable Docker Compose support (Not required for LogSentinel)
spring.docker.compose.enabled=false
