# Test Configuration for LogSentinel
# These values are only used during automated testing

# Dashboard Admin Credentials for Integration Tests
dashboard.admin.user=admin
dashboard.admin.password=sentinel

# H2 In-Memory Database for Fast Tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Keep H2 Console disabled in tests
spring.h2.console.enabled=false
